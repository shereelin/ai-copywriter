<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 頂級行銷文案工作台</title>
    <!-- [此處省略詳細 CSS 樣式，詳見參考文件] -->
    <style>
        /* 樣式優化，提供乾淨的工作台介面 */
        body { font-family: sans-serif; padding: 20px; background-color: #f3f4f6; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        .btn-submit { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; cursor: pointer; }
        #resultSection { display: none; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px; }
        #promptBox { white-space: pre-wrap; background: #1e293b; color: #cbd5e1; padding: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>AI 頂級行銷文案工作台</h2>
    <div class="form-group"><label>商品名稱</label><input type="text" id="prodName"></div>
    <div class="form-group"><label>特色與規格</label><textarea id="prodFeatures"></textarea></div>
    <div class="form-group"><label>目標客群 (TA)</label><input type="text" id="targetAudience"></div>
    <div class="form-group"><label>痛點或渴望</label><input type="text" id="corePain"></div>
    <div class="form-group">
        <label>選擇風格</label>
        <select id="copyStyle">
            <option value="情境共鳴型">情境共鳴型</option>
            <option value="知識科普型">知識科普型</option>
        </select>
    </div>
    <button class="btn-submit" onclick="generatePrompt()">一鍵調配提示詞</button>
    <div id="resultSection">
        <h3>複製下方指令貼給 AI：</h3>
        <div id="promptBox"></div>
        <button onclick="copyText()">一鍵複製</button>
    </div>
</div>
<script>
function generatePrompt() {
    const name = document.getElementById('prodName').value;
    const features = document.getElementById('prodFeatures').value;
    const style = document.getElementById('copyStyle').value;
    // 生成提示詞邏輯 (詳見參考文件)
    const prompt = `你是一位頂級行銷文案大師。請根據以下資訊撰寫風格為「${style}」的爆款文案：商品名稱-${name}，核心特色-${features}。請專注於痛點與生活畫面感，符合FB演算法，字數約300-500字。`;
    document.getElementById('promptBox').innerText = prompt;
    document.getElementById('resultSection').style.display = 'block';
}
function copyText() {
    navigator.clipboard.writeText(document.getElementById('promptBox').innerText);
    alert('已複製！');
}
</script>
</body>
</html>
